# GuoZhan 科技系统配置文件

# 科技系统设置
settings:
  research_time_base: 3600000      # 基础研究时间（1小时，毫秒）
  research_time_multiplier: 1.5    # 等级时间倍数
  max_concurrent_research: 1       # 最大同时研究数量
  effect_update_interval: 20       # 效果更新间隔（tick）
  enable_research_queue: false     # 是否启用研究队列
  auto_complete_research: true     # 是否自动完成研究

# 科技定义
technologies:
  # 基础农业科技
  farming_basic:
    name: "基础农业"
    description: "提升农作物产量和食物效果，为国民提供更好的营养"
    icon: WHEAT
    max_level: 3
    category: "basic"
    enabled: true
    prerequisites: []
    costs:
      1:
        gold: 500
        diamond: 5
        territory_income: 2
      2:
        gold: 1000
        diamond: 10
        territory_income: 4
      3:
        gold: 2000
        diamond: 20
        territory_income: 8
    effects:
      1:
        saturation:
          type: POTION_EFFECT
          effect: SATURATION
          amplifier: 0
          value: 1.0
          duration: -1
      2:
        saturation:
          type: POTION_EFFECT
          effect: SATURATION
          amplifier: 1
          value: 2.0
          duration: -1
      3:
        food_bonus:
          type: PASSIVE_ABILITY
          ability: FOOD_BONUS
          value: 0.25

  # 基础军事科技
  military_basic:
    name: "基础军事"
    description: "提升战斗能力和装备效果，增强国家军事实力"
    icon: IRON_SWORD
    max_level: 3
