name: 'Guozhan'
main: 'cn.lcofficial.guozhan.Guozhan'
version: ${version}
folia-supported: true
prefix: '国战'
api-version: 1.21
softdepend:
  - ProtocolLib
  - PlaceholderAPI
commands:
  u:
    description: '国战主命令'
  tribute:
    description: '贡献系统命令'
    aliases: [tr]
  tax:
    description: '税收系统命令'
    aliases: [taxes]
  c:
    description: '全球聊天命令'
    aliases: [global]
  w:
    description: '私聊命令'
    aliases: [whisper, tell, msg]
  gzgm:
    description: 'GuoZhan GM命令'
    permission: guozhan.admin.use
    permission-message: '你没有权限使用GM命令'
permissions:
  guozhan.admin.*:
    description: '所有GM权限'
    default: op
    children:
      guozhan.admin.use: true
      guozhan.admin.give: true
      guozhan.admin.war: true
      guozhan.admin.shield: true
      guozhan.admin.country: true
      guozhan.admin.economy: true
      guozhan.admin.territory: true
      guozhan.admin.teleport: true
      guozhan.admin.debug: true
      guozhan.admin.reload: true
      guozhan.admin.data: true
      guozhan.admin.notify: true
  guozhan.admin.use:
    description: '使用GM命令的基础权限'
    default: op
  guozhan.admin.give:
    description: '给予物品权限'
    default: op
  guozhan.admin.country:
    description: '国家管理权限'
    default: op
  guozhan.admin.economy:
    description: '经济管理权限'
    default: op
  guozhan.admin.territory:
    description: '领土管理权限'
    default: op
  guozhan.admin.teleport:
    description: '传送权限'
    default: op
  guozhan.admin.debug:
    description: '调试权限'
    default: op
  guozhan.admin.reload:
    description: '重载权限'
    default: op
  guozhan.admin.data:
    description: '数据管理权限'
    default: op
  guozhan.admin.notify:
    description: '接收GM操作通知权限'
    default: op
  guozhan.admin.war:
    description: '战争管理权限'
    default: op
  guozhan.admin.shield:
    description: '护盾管理权限'
    default: op

  # GM绕过权限
  guozhan.admin.bypass.cooldown:
    description: 绕过所有冷却时间限制
    default: op
  guozhan.admin.bypass.cost:
    description: 绕过所有资源消耗
    default: op
  guozhan.admin.bypass.restriction:
    description: 绕过所有限制条件
    default: op

  # GM强制权限
  guozhan.admin.force.rename:
    description: 强制重命名任何国家
    default: op
  guozhan.admin.force.transfer:
    description: 强制转移任何国家的君主之位
    default: op
  guozhan.admin.force.restore:
    description: 免费恢复任何国家的忠诚度
    default: op
  guozhan.admin.setrank:
    description: 设置玩家权限等级
    default: op
  guozhan.admin.cleardb:
    description: 清空数据库权限
    default: op

  # 玩家命令权限
  guozhan.command.*:
    description: '所有玩家命令权限'
    default: true
    children:
      guozhan.command.create: true
      guozhan.command.info: true
      guozhan.command.list: true
      guozhan.command.contribute: true
      guozhan.command.claim: true
      guozhan.command.unclaim: true
      guozhan.command.invite: true
      guozhan.command.accept: true
      guozhan.command.decline: true
      guozhan.command.leave: true
      guozhan.command.kick: true
      guozhan.command.promote: true
      guozhan.command.demote: true
      guozhan.command.transfer: true
      guozhan.command.rename: true
      guozhan.command.move: true
      guozhan.command.return: true
      guozhan.command.treasury: true
      guozhan.command.map: true
      guozhan.command.claimmode: true
      guozhan.command.war: true
      guozhan.command.shield: true
      guozhan.command.tech: true
      guozhan.command.declaration: true
      guozhan.command.title: true
      guozhan.command.profession: true
      guozhan.command.reload: true
  guozhan.command.create:
    description: '创建国家权限'
    default: true
  guozhan.command.info:
    description: '查看信息权限'
    default: true
  guozhan.command.list:
    description: '列出国家权限'
    default: true
  guozhan.command.contribute:
    description: '贡献资源权限'
    default: true
  guozhan.command.claim:
    description: '声明领土权限'
    default: true
  guozhan.command.unclaim:
    description: '放弃领土权限'
    default: true
  guozhan.command.invite:
    description: '邀请玩家权限'
    default: true
  guozhan.command.accept:
    description: '接受邀请权限'
    default: true
  guozhan.command.decline:
    description: '拒绝邀请权限'
    default: true
  guozhan.command.leave:
    description: '离开国家权限'
    default: true
  guozhan.command.kick:
    description: '踢出成员权限'
    default: true
  guozhan.command.promote:
    description: '册封大臣权限'
    default: true
  guozhan.command.demote:
    description: '罢免大臣权限'
    default: true
  guozhan.command.transfer:
    description: '禅让君主权限'
    default: true
  guozhan.command.rename:
    description: '重命名国家权限'
    default: true
  guozhan.command.move:
    description: '迁移王城权限'
    default: true
  guozhan.command.return:
    description: '回到王城权限'
    default: true
  guozhan.command.treasury:
    description: '查看国库权限'
    default: true
  guozhan.command.map:
    description: '查看疆域地图权限'
    default: true
  guozhan.command.claimmode:
    description: '切换声明模式权限'
    default: true
  guozhan.command.war:
    description: '战争系统权限'
    default: true
  guozhan.command.shield:
    description: '护盾系统权限'
    default: true
  guozhan.command.tech:
    description: '科技系统权限'
    default: true
  guozhan.command.declaration:
    description: '设置国家宣言权限'
    default: true
  guozhan.command.title:
    description: '设置成员头衔权限'
    default: true
  guozhan.command.profession:
    description: '职业系统权限'
    default: true
  guozhan.command.reload:
    description: '重载配置权限'
    default: op
libraries:
  - "org.jetbrains.kotlin:kotlin-stdlib:2.2.0"
  - "org.jetbrains.exposed:exposed-core:0.61.0"
  - "org.jetbrains.exposed:exposed-dao:0.61.0"
  - "org.jetbrains.exposed:exposed-jdbc:0.61.0"
  - "org.jetbrains.exposed:exposed-migration:0.61.0"
  - "com.alibaba.fastjson2:fastjson2:2.0.58"
  - "com.mysql:mysql-connector-j:9.4.0"
  - "com.zaxxer:HikariCP:5.0.1"