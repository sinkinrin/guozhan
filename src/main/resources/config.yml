# 国战插件配置文件

# 数据库配置
database:
  type: "mysql" # mysql 或 sqlite
  host: "localhost"
  port: 3306
  database: "guozhan"
  username: "root"
  password: "password"
  pool-size: 10

# 世界设置
world:
  name: "world"
  spawn-radius: 7500
  min-y: 64
  max-y: 100

# 国家设置
country:
  max-name-length: 12
  min-name-length: 3
  creation:
    item_cost:
      material: "IRON_INGOT" # 创建国家所需的物品类型
      amount: 64 # 创建国家所需的物品数量
    min-distance-between-countries: 2 # 国家之间的最小距离（区块）- 测试值：5区块(80格)，正式环境建议：50区块(800格)
  core-health-max: 1000
  core-health-initial: 50 # 初始核心血量（测试用）
  core-regen-interval: 60 # 秒
  core-regen-amount: 1

  # 核心保护机制
  core-protection:
    offline-protection: true # 离线保护开关
    min-online-members: 1 # 攻击核心需要的最少在线成员数
    require-war-declaration: true # 是否需要宣战才能攻击核心
    offline-attack-damage-reduction: 0.5 # 攻击离线国家的伤害减少（0.5 = 50%伤害）
    allow-siege-building: true # 战争期间是否允许在敌方核心领地内放置/破坏方块

# 领土设置
territory:
  max-loyalty: 100
  loyalty-decay-interval: 300 # 秒
  loyalty-restore-cost: 0.5 # 每1%忠诚度消耗的领土收入小时数

# 王战设置
war:
  day: 6 # 周六 (1-7)
  prepare-hour: 19
  prepare-minute: 0
  start-hour: 19
  start-minute: 20
  end-hour: 22
  end-minute: 0
  core-territory-range: [-64, 63] # 核心疆域范围
  war-territory-range: [-128, 127] # 王战活动范围

# 科技设置
technology:
  # 科技研究时间（秒），0表示瞬间完成
  research_duration: 0
  # 是否启用研究进度通知（当研究时间>0时）
  enable_progress_notifications: true
  # 进度通知间隔（秒），仅当研究时间>0时生效
  progress_notification_interval: 3600  # 默认每小时通知一次

# 护盾设置
shield:
  cost-per-hour: 5 # 每小时消耗的领土收入小时数（规范要求：每个护盾小时消耗五小时的区域收入）
  cooldown-minutes: 30 # 关闭后的冷却时间（分钟）
  max-duration-hours: 24 # 护盾最大持续时间（小时）
  min-duration-hours: 1 # 护盾最小持续时间（小时）
  max-aspect-ratio: 2.0 # 最大长宽比
  diamond-to-gold-rate: 10 # 钻石到金币的转换率（1钻石 = 10金币）
  max-members: 50 # 护盾激活时的最大成员数量限制（测试环境：50，正式环境可调整）

# 职业设置
profession:
  unlock-delay-hours: 2 # 建国后多久可以设置职业
  upgrade-delay-hours: 24 # 设置职业后多久可以升级
  upgrade-cost: 50 # 升级到2级需要的钻石数

# 税收设置
tax:
  regions:
    "失落蛮荒":
      range: 20000
      gold-rate: 0.004
      diamond-rate: 0.002
    "远征前线":
      range: 14000
      gold-rate: 0.008
      diamond-rate: 0.004
    "纷争之地":
      range: 9000
      gold-rate: 0.012
      diamond-rate: 0.008
    "开拓边疆":
      range: 5000
      gold-rate: 0.016
      diamond-rate: 0.012
    "内陆邦畿":
      range: 2500
      gold-rate: 0.02
      diamond-rate: 0.016
    "核心疆域":
      range: 1300
      gold-rate: 0.024
      diamond-rate: 0.024

# BossBar 配置
bossbar:
  enabled: true
  display-range: 100
  update-interval: 20
  title-format: "{country} 核心血量"
  show-to-attacker-country: true
  show-to-defender-country: true
  cache-duration: 30

# 随机出生系统配置
random-spawn:
  enabled: true
  spawn-radius: 5000
  max-attempts: 50
  safety-check-radius: 3
  min-distance-from-spawn: 1000
  allowed-worlds:
    - "world"
  unsafe-blocks:
    - "LAVA"
    - "WATER"
    - "FIRE"
  min-y-level: 60
  max-y-level: 120

# 消息设置
messages:
  prefix: "§6[国战] §r"
  no-permission: "§c你没有权限执行此操作"
  country-not-found: "§c国家不存在"
  player-not-found: "§c玩家不存在"
  not-in-country: "§c你不在任何国家中"
  not-owner: "§c只有君主才能执行此操作"
  not-admin: "§c只有君主或大臣才能执行此操作"