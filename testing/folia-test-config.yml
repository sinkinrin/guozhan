# Folia测试环境配置文件
# 此配置专门用于jpenilla/run-task的Folia集成测试

# 数据库配置（测试环境）
database:
  host: "localhost"
  port: 3306
  database: "guozhan_test"
  username: "test"
  password: "test123"
  
  # 连接池配置（测试环境较小）
  pool:
    maximum-pool-size: 5
    minimum-idle: 1
    connection-timeout: 10000
    idle-timeout: 300000
    max-lifetime: 900000

# 世界配置
world:
  default-world: "world"
  allowed-worlds:
    - "world"

# 随机出生系统（测试配置）
random-spawn:
  enabled: true
  spawn-radius: 1000  # 测试环境较小范围
  max-attempts: 20
  min-distance-from-spawn: 100
  safety-check-radius: 2
  min-y-level: 60
  max-y-level: 100
  allowed-worlds:
    - "world"
  unsafe-blocks:
    - "LAVA"
    - "WATER"
    - "FIRE"

# 国家系统配置（测试）
country:
  name:
    min-length: 2
    max-length: 10
    allowed-characters: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_"
  
  creation:
    cost: 100  # 测试环境降低成本
    cooldown: 60  # 1分钟冷却用于快速测试
  
  members:
    max-members: 10  # 测试环境较小规模
    invite-timeout: 60  # 1分钟邀请超时

# 领土系统配置（测试）
territory:
  claim:
    cost-per-chunk: 10
    max-chunks-per-country: 20
    min-distance-between-countries: 2
  
  protection:
    block-break: true
    block-place: true
    entity-damage: true
    container-access: false

# 外交系统配置（测试）
diplomacy:
  relations:
    default: "NEUTRAL"
    change-cooldown: 60  # 1分钟关系变更冷却
  
  war:
    damage-multiplier: 1.5
    kill-reward: 10
    victory-reward: 100
    defeat-penalty: 50
    max-duration: 3600  # 1小时最大战争持续时间

# 经济系统配置（测试）
economy:
  starting-resources:
    gold: 500
    diamond: 50
  
  tax:
    default-rate: 0.1
    max-rate: 0.3
    collection-interval: 300  # 5分钟收税间隔

# 贡献系统配置（测试）
tribute:
  relations:
    max-tribute-rate: 0.2
    min-tribute-rate: 0.05
    processing-interval: 300  # 5分钟处理间隔

# 聊天系统配置
chat:
  format:
    country: "§7[§6{country}§7] §f{player}§7: §f{message}"
    global: "§7[§aGlobal§7] §f{player}§7: §f{message}"
    private: "§7[§dPrivate§7] §f{from} §7→ §f{to}§7: §f{message}"

# 测试专用配置
testing:
  # 启用详细日志用于测试
  verbose-logging: true
  
  # 快速模式（减少延迟用于测试）
  fast-mode: true
  
  # 测试数据自动清理
  auto-cleanup: true
  
  # 测试用户配置
  test-users:
    - "TestPlayer1"
    - "TestPlayer2"
    - "TestPlayer3"
  
  # 测试国家配置
  test-countries:
    - name: "TestCountry1"
      leader: "TestPlayer1"
    - name: "TestCountry2"
      leader: "TestPlayer2"

# 调试配置
debug:
  enabled: true
  log-level: "DEBUG"
  performance-monitoring: true
  
  # Folia特定调试
  folia-debug:
    region-scheduler: true
    entity-scheduler: true
    async-operations: true
