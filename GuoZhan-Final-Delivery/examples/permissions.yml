# ================================
# 推荐的权限分配策略
# ================================

recommended_strategy: |
  1. 新玩家 (default组):
     - 只给予基础查看和创建权限
     - 可以接受邀请但不能邀请他人
     - 可以贡献资源但不能管理
  
  2. 普通玩家 (vip组):
     - 可以占领和管理领土
     - 可以使用科技和外交系统
     - 可以参与大部分游戏功能
  
  3. 国家管理者 (admin组):
     - 可以邀请和管理成员
     - 可以使用高级国家功能
     - 可以进行战争和外交决策
  
  4. 服务器管理员 (owner组):
     - 拥有所有GM权限
     - 可以调试和维护系统
     - 可以处理紧急情况

# ================================
# 安全建议
# ================================

security_recommendations: |
  1. 权限最小化原则:
     - 只给予必要的权限
     - 定期审查权限分配
     - 避免给予过多权限
  
  2. 敏感权限保护:
     - guozhan.admin.cleardb 只给予最高管理员
     - guozhan.admin.setrank 限制使用
     - 定期检查管理员权限使用情况
  
  3. 权限继承:
     - 使用权限组继承减少配置复杂度
     - 确保权限层级清晰
     - 避免权限冲突
  
  4. 监控和日志:
     - 启用权限使用日志
     - 监控敏感操作
     - 定期备份权限配置
